<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в панель управления | rifemotion</title>
    <link rel="icon" type="image/png" href="/static/icones/favicon.png">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 44px; height: 44px; font-size: 1.25rem;">R</div>
                <h1>rifemotion admin</h1>
                <p>Вход в защищенную панель управления</p>
            </div>

            {% if error %}
            <div class="alert alert-danger">
                <span>⚠️</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/admin/login" autocomplete="off">
                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        value="{{ username or '' }}"
                        required 
                        autofocus
                        placeholder="admin"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        required 
                        placeholder="••••••••••••"
                    >
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">
                    Продолжить
                </button>
            </form>
        </div>
    </div>
</body>
</html>
