<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rifemotion</title>
    <link rel="icon" type="image/png" href="/static/icones/favicon.png">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0a;
        }

        .bg-video {
            position: fixed;
            top: 0;
            left: 50%;
            width: max(100vw, 177.78vh);
            height: max(100vh, 56.25vw);
            transform: translateX(-50%) translateY(calc(-1 * clamp(0px, 56.25vw - 100vh, 30px)));
            z-index: 1;
            object-fit: cover;
        }

        .ae-blur-mask {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate3d(-50%, -50%, 0);
            border-radius: 50%;
            border: 200vmax solid #0a0a0a;
            filter: blur(10vmin);
            z-index: 2;
            pointer-events: none;
            animation: openHole 5s cubic-bezier(.05, 0, .1, 1) .1s forwards;
            will-change: width, height;
        }

        @keyframes openHole {
            0% {
                width: 0;
                height: 0;
            }

            100% {
                width: 250vmax;
                height: 180vmax;
            }
        }

        /* --- Стили для социальных сетей --- */
        .social-links {
            position: fixed;
            display: flex;
            z-index: 10;
        }

        .social-links a {
            display: block;
            width: 26px;
            height: 26px;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .social-links a:hover {
            transform: scale(1.15);
            opacity: 0.85;
        }

        .social-links img {
            width: 100%;
            height: 100%;
            display: block;
            filter: brightness(0) invert(1);
        }

        /* Мобильные устройства (внизу, по центру, в ряд) */
        @media (max-width: 768px) {
            .social-links {
                bottom: 40px;
                left: 50%;
                transform: translateX(-50%);
                flex-direction: row;
                gap: 16px;
            }
        }

        @media (min-width: 769px) {
            .social-links {
                left: 40px;
                top: 50%;
                transform: translateY(-50%);
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <video class="bg-video" autoplay muted loop playsinline>
        <source src="/static/video.webm" type="video/webm">
        <source src="/static/video.mp4" type="video/mp4">
    </video>

    <div class="ae-blur-mask"></div>

    <div class="social-links">
        <a href="#" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><img src="/static/icones/MdiInstagram.svg" alt="Instagram"></a>
        <a href="#" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><img src="/static/icones/IcBaselineTiktok.svg" alt="TikTok"></a>
        <a href="#" target="_blank" rel="noopener noreferrer" aria-label="X"><img src="/static/icones/RiTwitterXFill.svg" alt="X"></a>
        <a href="#" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><img src="/static/icones/SiYoutubeFill.svg" alt="YouTube"></a>
        <a href="#" target="_blank" rel="noopener noreferrer" aria-label="Telegram"><img src="/static/icones/MingcuteTelegramFill.svg" alt="Telegram"></a>
        <a href="mailto:your-email@example.com" aria-label="Email"><img src="/static/icones/MaterialSymbolsMailOutlineRounded.svg" alt="Email"></a>
    </div>

</body>

</html>
